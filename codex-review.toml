# Settings for the independent Codex reviewer (scripts/codex-review.sh). See AGENTS.md,
# "Independent reviewer".
#
# model            — the Codex model that reviews. Environment override: OMT_REVIEW_MODEL.
# fast             — request Fast mode, which codex spells service_tier "priority": the model catalogue
#                    describes the tier as "2x speed, increased usage" (`codex debug models`). That
#                    figure is the catalogue's own product claim about the model, not a measurement of a
#                    review round. The tier is picked per turn, so the script sends it on every round,
#                    including a resumed one.
# reasoning_effort — how hard the model reasons, which codex spells model_reasoning_effort. The levels
#                    are per model and `codex debug models` lists them under supported_reasoning_levels
#                    (low, medium, high, xhigh, max and, on some models, ultra). Environment override:
#                    OMT_REVIEW_REASONING_EFFORT. The level is picked per turn, so the script sends it on
#                    every round, including a resumed one. Omit the key and no flag is sent: codex then
#                    uses the model's own default or the level configured in ~/.codex/config.toml, so
#                    state the key here to pin the reviewer's effort.
#
# `fast = false` sends service_tier "default" explicitly rather than leaving the setting out, so a Fast
# mode enabled in ~/.codex/config.toml or in the project's .codex/config.toml cannot leak into a review.
# There is no equivalent neutral level for reasoning_effort — codex has no value that means "unset" — so
# an omitted key leaves a globally configured level in force rather than inventing one, which is also how
# the reviewer ran before this setting existed.
#
# Only the three settings above are read. An unknown key here is refused instead of ignored: a typo would
# otherwise change how the review runs without saying so, and a review's own settings should never be
# silently different from the file that states them.
[review]
model = "gpt-6.1-sol"
fast = false
reasoning_effort = "high"
# low/medium/high/xhigh/max
